<!DOCTYPE html>
<html lang="tr" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MLAOJ | Studio IDE v2.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-950 text-gray-100 font-sans h-full flex flex-col overflow-hidden">

    <header class="border-b border-gray-800 bg-gray-900/90 px-6 py-3 flex justify-between items-center z-10 flex-wrap gap-2">
        <div class="flex items-center gap-3">
            <a href="index.html" class="flex items-center gap-2 text-gray-400 hover:text-white transition">
                <i class="fa-solid fa-arrow-left"></i>
                <span class="text-xs font-semibold">Ana Sayfa</span>
            </a>
            <span class="text-gray-700">|</span>
            <span class="font-bold text-white flex items-center gap-2"><i class="fa-solid fa-code text-blue-400"></i> MLAOJ Studio Pro</span>
        </div>
        
        <div class="flex items-center gap-2">
            <button onclick="loadTemplate('tailwind')" class="bg-gray-800 hover:bg-gray-700 text-xs px-3 py-1.5 rounded-lg border border-gray-700">Tailwind Şablonu</button>
            <button onclick="saveLocal()" class="bg-blue-600 hover:bg-blue-700 text-xs px-3 py-1.5 rounded-lg font-bold">Kaydet</button>
            <button onclick="runStudioCode()" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs px-4 py-1.5 rounded-lg font-bold flex items-center gap-2">
                <i class="fa-solid fa-play"></i> Çalıştır
            </button>
        </div>
    </header>

    <main class="flex-1 grid grid-cols-1 lg:grid-cols-2 gap-2 p-3 overflow-hidden">
        <div class="flex flex-col bg-gray-900 border border-gray-800 rounded-xl overflow-hidden">
            <div class="bg-gray-950 px-4 py-2 border-b border-gray-800 flex justify-between items-center">
                <span class="text-xs font-mono text-gray-400">Editor Pane</span>
                <span id="saveStatus" class="text-[10px] text-gray-500">Otomatik Kayıt Devrede</span>
            </div>
            <textarea id="studioInput" class="flex-1 w-full bg-gray-950 p-4 font-mono text-sm text-green-400 focus:outline-none resize-none leading-relaxed" spellcheck="false"></textarea>
        </div>

        <div class="flex flex-col bg-gray-900 border border-gray-800 rounded-xl overflow-hidden">
            <div class="bg-gray-950 px-4 py-2 border-b border-gray-800">
                <span class="text-xs font-mono text-gray-400">Live Preview Panel</span>
            </div>
            <div class="flex-1 bg-white overflow-hidden">
                <iframe id="studioPreview" class="w-full h-full border-none"></iframe>
            </div>
        </div>
    </main>

    <script>
        const defaultCode = `<!DOCTYPE html>\n<html>\n<head>\n<script src="https://cdn.tailwindcss.com"><\/script>\n</head>\n<body class="bg-slate-900 text-white flex justify-center items-center h-screen">\n  <div class="text-center p-8 bg-slate-800 rounded-2xl border border-slate-700">\n    <h1 class="text-3xl font-bold text-blue-400">🚀 MLAOJ IDE Ready!</h1>\n    <p class="text-slate-400 mt-2">Kodlarınızı değiştirdiğinizde anında render edilir.</p>\n  </div>\n</body>\n</html>`;

        const studioInput = document.getElementById('studioInput');

        function runStudioCode() {
            const code = studioInput.value;
            const preview = document.getElementById('studioPreview');
            preview.contentWindow.document.open();
            preview.contentWindow.document.write(code);
            preview.contentWindow.document.close();
            localStorage.setItem('mlaoj_saved_code', code);
        }

        function saveLocal() {
            localStorage.setItem('mlaoj_saved_code', studioInput.value);
            document.getElementById('saveStatus').innerText = "Kaydedildi!";
            setTimeout(() => document.getElementById('saveStatus').innerText = "Otomatik Kayıt Devrede", 2000);
        }

        function loadTemplate(type) {
            if(type === 'tailwind') {
                studioInput.value = defaultCode;
                runStudioCode();
            }
        }

        window.onload = () => {
            const saved = localStorage.getItem('mlaoj_saved_code');
            studioInput.value = saved ? saved : defaultCode;
            runStudioCode();
        };
    </script>
</body>
</html>
