<!DOCTYPE html>
<html lang="tr" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MLAOJ | Geliştirici Araçları</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-950 text-gray-100 font-sans flex flex-col min-h-screen">

    <header class="border-b border-gray-800 bg-gray-900/80 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <a href="index.html" class="flex items-center gap-3">
                <img src="file_00000000e57c81f48430089ff2017f8a.png" class="w-9 h-9 rounded-full border border-gray-700">
                <span class="font-extrabold text-xl text-white">MLAOJ <span class="text-purple-400 text-xs font-mono">Tools</span></span>
            </a>
            <div class="flex gap-4">
                <a href="index.html" class="text-xs font-semibold text-gray-300 hover:text-white transition py-2">Ana Sayfa</a>
                <a href="scripts.html" class="text-xs font-semibold text-gray-300 hover:text-white transition py-2">Kod Bankası</a>
                <a href="studio.html" class="bg-purple-600 hover:bg-purple-700 text-white text-xs px-4 py-2 rounded-lg font-bold transition">IDE Studio</a>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-10 w-full flex-1">
        <div class="border-l-4 border-purple-500 pl-4 mb-8">
            <h1 class="text-3xl font-black text-white">İleri Seviye Kod Araçları</h1>
            <p class="text-xs text-gray-400 mt-1">Kod Karşılaştırma (Diff) ve Metin İstatistik Araçları.</p>
        </div>

        <div class="bg-gray-900 border border-gray-800 rounded-2xl p-6 mb-8">
            <h2 class="text-lg font-bold text-purple-400 mb-4 flex items-center gap-2"><i class="fa-solid fa-code-compare"></i> Kod Karşılaştırma (Diff Checker)</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                <div>
                    <label class="text-xs text-gray-400 block mb-1">Orijinal Kod</label>
                    <textarea id="diff1" class="w-full h-40 bg-gray-950 border border-gray-800 rounded-xl p-3 text-xs font-mono text-gray-200 focus:outline-none focus:border-purple-500" placeholder="Birinci kod bloğunu buraya yapıştırın..."></textarea>
                </div>
                <div>
                    <label class="text-xs text-gray-400 block mb-1">Değiştirilmiş Kod</label>
                    <textarea id="diff2" class="w-full h-40 bg-gray-950 border border-gray-800 rounded-xl p-3 text-xs font-mono text-gray-200 focus:outline-none focus:border-purple-500" placeholder="İkinci kod bloğunu buraya yapıştırın..."></textarea>
                </div>
            </div>
            <button onclick="compareCodes()" class="bg-purple-600 hover:bg-purple-500 text-white text-xs font-bold px-6 py-2.5 rounded-xl transition">Kodları Karşılaştır</button>
            <div id="diffResult" class="mt-4 p-4 bg-gray-950 border border-gray-800 rounded-xl font-mono text-xs text-gray-300 min-h-[50px]">Karşılaştırma sonucu burada görüntülenecek...</div>
        </div>
    </main>

    <footer class="border-t border-gray-800 py-6 text-center text-xs text-gray-500">
        © 2026 MLAOJ Developer Tools.
    </footer>

    <script>
        function compareCodes() {
            const t1 = document.getElementById('diff1').value.split('\n');
            const t2 = document.getElementById('diff2').value.split('\n');
            const res = document.getElementById('diffResult');
            
            if(t1.join('') === t2.join('')) {
                res.innerHTML = '<span class="text-green-400">✅ Kodlar birebir aynı! Herhangi bir fark yok.</span>';
                return;
            }

            let output = '<div class="space-y-1">';
            const max = Math.max(t1.length, t2.length);
            for(let i=0; i<max; i++) {
                if(t1[i] !== t2[i]) {
                    output += `<div class="bg-red-950/50 text-red-300 p-1 rounded">Satır ${i+1}: "${t1[i] || ''}" ➔ "${t2[i] || ''}"</div>`;
                }
            }
            output += '</div>';
            res.innerHTML = output;
        }
    </script>
</body>
</html>
